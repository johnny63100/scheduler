<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1c1c1f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Holmes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<title>Holmes</title>
<style>
  :root {
    --bg: #f4f5fa; --surface: #fff; --surface-2: #f2f3f8; --surface-3: #e9ebf3; --border: #e5e7ef;
    --text: #1e2232; --muted: #6a7085; --faint: #a0a5b5;
    --primary: #1c1c1f; --primary-soft: #ececef; --on-primary: #ffffff; --danger: #ef5d6c; --danger-soft: #fdecee;
    --warn-soft: #fff6e0; --warn: #a8691f;
    --radius: 16px; --radius-sm: 12px;
    --shadow: 0 6px 24px rgba(30, 34, 50, .08);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131419; --surface: #1c1d24; --surface-2: #23252e; --surface-3: #2c2e39; --border: #2f3240;
      --text: #ecedf3; --muted: #9a9fb2; --faint: #6c7184; --primary: #ececef; --primary-soft: #2c2e39; --on-primary: #131419;
      --danger-soft: #3a1f25; --warn-soft: #3a2f17; --warn: #f2c46b; --shadow: 0 6px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.45; min-height: 100dvh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---- shell */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  header .sync { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { padding: 4px 16px calc(110px + var(--safe-b)); max-width: 640px; margin: 0 auto; }

  nav.tabs { position: fixed; left: 16px; bottom: calc(14px + var(--safe-b)); z-index: 6;
    display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--border); width: max-content; }
  nav.tabs button { border: 0; background: transparent; padding: 10px 14px; white-space: nowrap; border-radius: 999px; font-weight: 600; color: var(--muted); }
  nav.tabs button.on { background: var(--primary); color: var(--on-primary); }
  .fab { position: fixed; right: 18px; bottom: calc(14px + var(--safe-b)); z-index: 6; width: 54px; height: 54px; border-radius: 50%; border: 0;
    background: var(--primary); color: var(--on-primary); box-shadow: 0 8px 22px rgba(0, 0, 0, .25); display: grid; place-items: center; }
  .fab svg { width: 24px; height: 24px; }

  .banner { margin: 6px 0 12px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .banner.error { background: var(--danger-soft); color: var(--danger); }

  /* ---- day strip */
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip button { flex: 0 0 auto; width: 46px; padding: 8px 0 6px; border: 0; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .strip .dow { font-size: 11px; color: var(--muted); }
  .strip .num { font-weight: 700; font-size: 16px; }
  .strip .dots { display: flex; gap: 2px; height: 5px; }
  .strip .dots i { width: 5px; height: 5px; border-radius: 50%; }
  .strip button.today .num { color: var(--primary); }
  .strip button.sel { background: var(--primary); }
  .strip button.sel .dow, .strip button.sel .num { color: var(--on-primary); }
  .strip .sun { color: #e0566b; } .strip .sat { color: #4a83e8; }

  /* ---- agenda */
  .day { margin-bottom: 16px; scroll-margin-top: 70px; }
  .day h3 { font-size: 13px; color: var(--muted); margin: 0 4px 6px; font-weight: 600; }
  .day h3 b { color: var(--text); font-size: 15px; margin-right: 6px; }
  .day.is-today h3 b { color: var(--primary); }
  .card { background: var(--surface); border-radius: var(--radius); padding: 4px; box-shadow: 0 1px 0 var(--border); }
  .ev { display: flex; gap: 12px; padding: 10px 12px; align-items: flex-start; border-radius: 12px; }
  .ev + .ev { border-top: 1px solid var(--surface-2); }
  .ev .bar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
  .ev .time { width: 52px; flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .ev .body { min-width: 0; flex: 1; }
  .ev .title { font-weight: 600; word-break: break-word; }
  .ev .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .ev.cancelled .title { text-decoration: line-through; color: var(--faint); }
  .ev.todo-due .title::before { content: '☐ '; color: var(--muted); }
  .ev.todo-due.done .title { text-decoration: line-through; color: var(--faint); }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); margin-left: 6px; vertical-align: 1px; }
  .chip.err { background: var(--danger-soft); color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .more { display: block; margin: 0 auto 14px; border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; }

  .ev[data-ev] { cursor: pointer; }
  .ev[data-ev]:active { background: var(--surface-2); }

  /* ---- month calendar */
  .cal-head { display: flex; align-items: center; gap: 8px; margin: 2px 2px 10px; }
  .cal-head h2 { font-size: 18px; margin: 0; flex: 1; }
  .cal-head button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface); font-size: 18px; color: var(--muted); }
  .cal-head .mode-btn { width: auto; border-radius: 999px; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--text); }
  .cal-head .today-btn { width: auto; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .month { background: var(--surface); border-radius: var(--radius); padding: 8px 4px 6px; }
  .month .dows, .month .week { display: grid; grid-template-columns: repeat(7, 1fr); }
  .month .dows span { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 6px; }
  .month .dows span:first-child, .cell.sun .n, .cell.hd .n { color: #e0566b; }
  .month .dows span:last-child, .cell.sat .n { color: #4a83e8; }
  .cell { min-height: 64px; border: 0; background: none; padding: 3px 1px 2px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; border-radius: 10px; min-width: 0; text-align: left; }
  .cell .n { align-self: center; font-size: 13px; font-weight: 600; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; }
  .cell.other { opacity: .35; }
  .month .week { position: relative; }
  .cell .lanes { display: block; flex: none; }
  .span { position: absolute; height: 14px; line-height: 14px; font-size: 10px; padding: 0 3px; border-radius: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #1e2232; pointer-events: none; }
  .span.cont-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .span.cont-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .span.light { background: var(--surface-3) !important; color: var(--muted); }
  .cell.today .n { background: var(--primary-soft); color: var(--primary); }
  .cell.sel { background: var(--surface-2); }
  .cell.sel .n { background: var(--primary); color: var(--on-primary); }
  .cell .pill { display: block; font-size: 10px; line-height: 14px; height: 14px; padding: 0 3px; border-radius: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #1e2232; }
  .cell .pill.light { background: var(--surface-3) !important; color: var(--muted); }
  .cell .more-n { font-size: 10px; color: var(--muted); padding-left: 3px; }
  .sel-day { margin-top: 16px; }
  .hol { color: var(--faint); font-weight: 500; }

  /* ---- health */
  .daynav { display: flex; align-items: center; gap: 8px; margin: 2px 2px 12px; }
  .daynav h2 { flex: 1; text-align: center; font-size: 17px; margin: 0; }
  .daynav button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface); font-size: 18px; color: var(--muted); }
  .daynav button:disabled { opacity: .3; }
  .kcal { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .kcal .big { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .kcal .big small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .kcal .big.over { color: var(--danger); }
  .kcal .label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .kcal .bar2 { height: 8px; border-radius: 99px; background: var(--surface-3); margin: 12px 0 10px; overflow: hidden; display: flex; }
  .kcal .bar2 i { display: block; height: 100%; }
  .kcal .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12.5px; color: var(--muted); }
  .kcal .nums b { display: block; color: var(--text); font-size: 15px; }
  .row-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; cursor: pointer; }
  .row-item + .row-item { border-top: 1px solid var(--surface-2); }
  .row-item .grow { flex: 1; min-width: 0; }
  .row-item .k { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row-item.planned .name { color: var(--muted); }
  .row-item .check { --gc: var(--primary); }
  .row-item.eaten .check { background: var(--primary); border-color: var(--primary); }
  .row-item.eaten .check svg { opacity: 1; color: var(--on-primary); }
  .row-item .ico { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; flex: none; }
  .section-h { display: flex; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 700; margin: 0 4px 6px; }
  .section-h small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .hblock { margin-bottom: 16px; }

  /* ---- money */
  .money-sum .big.income { color: #1f9d68; }
  .cats { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .cats .c { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
  .cats .track { grid-column: 2 / 4; height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: -4px; }
  .cats .track i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
  .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amt.in { color: #1f9d68; }
  .catgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .catgrid button { border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; padding: 8px 2px; font-size: 11.5px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .catgrid button span { font-size: 18px; }
  .catgrid button.on { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 1px var(--primary); font-weight: 700; }
  .input.amount { font-size: 24px; font-weight: 800; text-align: right; }
  .mode-btn { border: 0; background: var(--surface); border-radius: 999px; padding: 0 12px; height: 34px; font-size: 13px; font-weight: 600; white-space: nowrap; flex: none; }

  /* ---- one-line notes */
  .memo-add { display: flex; gap: 8px; margin: 2px 0 14px; }
  .memo-add .input { flex: 1; min-width: 0; }
  .memo-add .btn { width: auto; margin: 0; padding: 0 18px; font-size: 15px; }
  .memo { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 12px 14px; }
  .memo + .memo { border-top: 1px solid var(--surface-2); }
  .memo .t { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .memo .x { flex: none; border: 0; background: none; color: var(--faint); font-size: 18px; line-height: 1; padding: 2px 4px; }
  .memo .x.armed { color: var(--danger); font-size: 13px; font-weight: 700; }

  .row-item.fx.eaten .name, .row-item.fx.eaten .amt { color: var(--muted); text-decoration: line-through; }
  .row-item.fx .k.late { color: var(--danger); font-weight: 600; }
  .row-item.fx .k.soon { color: #c98a1a; font-weight: 600; }

  /* ---- todos */
  .group { margin-bottom: 16px; }
  .group h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0 4px 6px; }
  .group h3 i { width: 10px; height: 10px; border-radius: 50%; }
  .group h3 small { color: var(--muted); font-weight: 500; }
  .todo { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; }
  .todo + .todo { border-top: 1px solid var(--surface-2); }
  .todo.sub { padding-left: 40px; }
  .check { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--faint); background: transparent; display: grid; place-items: center; padding: 0; margin-top: 0; }
  .check svg { width: 14px; height: 14px; opacity: 0; color: #fff; }
  .todo.done .check { background: var(--gc, var(--primary)); border-color: var(--gc, var(--primary)); }
  .todo.done .check svg { color: var(--on-primary); }
  .todo.done .check svg { opacity: 1; }
  .todo.done .title { text-decoration: line-through; color: var(--faint); }
  .todo .title { word-break: break-word; }
  .todo .due { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .todo .due.late { color: var(--danger); }
  details.done-list summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 8px 12px; }
  details.done-list summary::-webkit-details-marker { display: none; }

  /* ---- sheet */
  .scrim { position: fixed; inset: 0; background: rgba(15, 17, 26, .38); z-index: 20; opacity: 0; transition: opacity .2s; }
  .scrim.open { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 22px 22px 0 0;
    padding: 10px 18px calc(18px + var(--safe-b)); max-height: 92dvh; overflow-y: auto; transform: translateY(100%); transition: transform .25s ease; max-width: 640px; margin: 0 auto; }
  .sheet.open { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 0 auto 12px; }
  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 9px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .field { margin-bottom: 12px; }
  .field > label { display: block; font-size: 12.5px; color: var(--muted); margin: 0 0 5px 2px; font-weight: 600; }
  .input { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); outline: none; font-size: 16px; }
  .input:focus { border-color: var(--primary); background: var(--surface); }
  textarea.input { min-height: 70px; resize: vertical; }
  .input.title { font-size: 18px; font-weight: 600; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; margin-bottom: 8px; font-weight: 600; }
  .switch { appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--surface-3); position: relative; transition: background .2s; margin: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .switch:checked { background: var(--primary); }
  .switch:checked::after { background: var(--on-primary); }
  .switch:checked::after { transform: translateX(18px); }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .colors button.on { border-color: var(--surface); box-shadow: 0 0 0 2px var(--text); }
  .btn { width: 100%; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; background: var(--primary); color: var(--on-primary); margin-top: 6px; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .sheet-title { font-size: 17px; font-weight: 700; margin: 0 2px 12px; }
  .scope { margin-bottom: 12px; }
  .scope p { font-size: 12.5px; color: var(--muted); margin: 0 0 6px 2px; font-weight: 600; }

  /* ---- setup */
  .setup { max-width: 420px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 40px) 22px 40px; }
  .setup .logo { width: 72px; height: 72px; border-radius: 20px; display: block; margin: 0 auto 14px; }
  .setup h2 { text-align: center; margin: 0 0 6px; }
  .setup p.lead { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .setup .hint { font-size: 12.5px; color: var(--muted); margin: 14px 2px 0; }
  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; display: block; margin: 16px auto 0; }

  .toast { position: fixed; left: 50%; bottom: calc(84px + var(--safe-b)); transform: translateX(-50%) translateY(20px); z-index: 30; opacity: 0;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; transition: all .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .menu { position: absolute; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 10; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); padding: 6px; min-width: 190px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 10px; }
  .menu button:active { background: var(--surface-2); }
  .menu .who { font-size: 12px; color: var(--muted); padding: 6px 12px 8px; border-bottom: 1px solid var(--surface-2); margin-bottom: 4px; word-break: break-all; }
</style>
</head>
<body>

<!-- Step 1: Supabase project -->
<section class="setup" id="v-config" hidden>
  <img class="logo" src="icon-192.png" alt="" />
  <h2>Holmes 연결하기</h2>
  <p class="lead">PC 앱 설정의 <b>휴대폰 동기화</b>에 넣은 것과<br />같은 Supabase 프로젝트 정보를 입력해 주세요.</p>
  <div class="field"><label for="c-url">프로젝트 URL</label><input id="c-url" class="input" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="off" /></div>
  <div class="field"><label for="c-key">공개 키 (publishable / anon)</label><input id="c-key" class="input" placeholder="sb_publishable_… 또는 eyJ…" autocomplete="off" autocapitalize="off" /></div>
  <button class="btn" id="c-save">다음</button>
  <p class="hint">Supabase 대시보드 → Project Settings → API Keys 에서 찾을 수 있어요. 이 정보는 이 휴대폰에만 저장돼요.</p>
</section>

<!-- Step 2: sign in -->
<section class="setup" id="v-login" hidden>
  <img class="logo" src="icon-192.png" alt="" />
  <h2>로그인</h2>
  <p class="lead">PC 앱과 같은 계정으로 로그인해 주세요.</p>
  <div class="field"><label for="l-email">이메일</label><input id="l-email" class="input" type="email" autocomplete="username" autocapitalize="off" /></div>
  <div class="field"><label for="l-pw">비밀번호</label><input id="l-pw" class="input" type="password" autocomplete="current-password" /></div>
  <button class="btn" id="l-go">로그인</button>
  <button class="link" id="l-back">프로젝트 정보 다시 입력</button>
</section>

<!-- Main -->
<div id="v-main" hidden>
  <header>
    <div>
      <h1 id="h-title">일정</h1>

// Boot

async function boot() {
  if (!cfg?.url || !cfg?.key) {
    $('#c-url').value = cfg?.url || '';
    $('#c-key').value = cfg?.key || '';
    return show('v-config');
  }
  sb = createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  user = data.session?.user ?? null;
  if (!user) return show('v-login');
  show('v-main');
  $('#m-who').textContent = user.email;
  await load();
  subscribe();
}

  const url = $('#c-url').value.trim().replace(/\/+$/, '');

  if (!/^https:\/\/.+/.test(url) || key.length < 20) return toast('URL과 키를 확인해 주세요');
  cfg = { url, key };
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  boot();
};

$('#l-go').onclick = async () => {
  const email = $('#l-email').value.trim();

  if (!email || !password) return;
  $('#l-go').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('#l-go').disabled = false;

};

// ---------------------------------------------------------------------------
// Data

async function load() {
  if (loading || !sb) return;
  loading = true;
  $('#b-refresh').classList.add('spinning');
  try {
    const [s, i] = await Promise.all([
      sb.from('nora_snapshot').select('data, updated_at').maybeSingle(),
      sb.from('nora_inbox').select('id, kind, payload, created_at, applied_at, error').order('id', { ascending: false }).limit(60),
    ]);
    if (s.error) throw s.error;
    if (i.error) throw i.error;
    snapshot = s.data?.data ?? null;
    inbox = (i.data ?? []).reverse();
    render();
  } catch (e) {
    if (String(e?.message || e).includes('JWT')) { await sb.auth.signOut(); return boot(); }
    toast('불러오기 실패: ' + (e?.message || e));
  } finally {
    loading = false;
    $('#b-refresh').classList.remove('spinning');
  }
}

function subscribe() {
  if (channel) return;
  channel = sb.channel('nora')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'nora_snapshot' }, () => load())
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'nora_inbox' }, () => load())
    .subscribe();
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && user) load(); });
setInterval(() => { if (document.visibilityState === 'visible' && user) load(); }, 30000);

/** Requests the PC has not reflected in the snapshot yet (or that failed there). */
function pending() {
  const since = snapshot ? Date.parse(snapshot.generated_at) : 0;
  return inbox.filter((r) => !r.applied_at || (r.error ? Date.parse(r.applied_at) > Date.now() - 86400000 : Date.parse(r.applied_at) > since));
}

async function send(kindName, payload) {
  const { data, error } = await sb.from('nora_inbox').insert({ kind: kindName, payload }).select().single();
  if (error) { toast('보내기 실패: ' + error.message); return false; }
  inbox.push(data);
  render();
  return true;
}

  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return `${m}분 전`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}시간 전`;
  return `${Math.round(h / 24)}일 전`;
}

  const banner = $('#banner');

    return;
  }
  const at = Date.parse(snapshot.generated_at);

  banner.innerHTML = html;
}

/** Days a stored event covers (all-day end is inclusive; a timed event ending at 00:00 stops the day before). */
function eventDays(e) {
  const s = e.start.slice(0, 10);
  let end = e.end.slice(0, 10);
  if (!e.all_day && e.end.slice(11, 16) === '00:00' && end > s) end = addDays(end, -1);
  const out = [];
  for (let d = s; d <= end && out.length < 62; d = addDays(d, 1)) out.push(d);
  return out;
}

const fromForm = (p) => ({
  title: p.title, all_day: !!p.all_day, location: p.location || '', memo: p.memo || '',
  start: `${p.start_date}T${p.all_day ? '00:00' : p.start_time || '09:00'}:00`,
  end: `${p.end_date || p.start_date}T${p.all_day ? '00:00' : p.end_time || p.start_time || '10:00'}:00`,
});
const sameOcc = (e, p) => e.id === p.id && (e.occurrence ?? null) === (p.occurrence ?? null);

function allEvents() {
  let list = (snapshot?.events ?? []).map((e) => ({ ...e, pending: false }));
  for (const r of pending()) {
    if (r.error) continue;
    const p = r.payload;
    if (r.kind === 'delete_event') {
      list = list.filter((e) => !(p.scope === 'all' || !e.repeats ? e.id === p.id : sameOcc(e, p)));
    } else if (r.kind === 'update_event') {
      list = list.map((e) => {
        if (sameOcc(e, p)) return { ...e, ...fromForm(p), color: p.color ?? e.color, reminder: p.reminder, pending: !r.applied_at };
        if (p.scope === 'all' && e.id === p.id) return { ...e, title: p.title, color: p.color ?? e.color, location: p.location || '', memo: p.memo || '', pending: !r.applied_at };
        return e;
      });
    }
  }
  for (const r of pending()) {
    if (r.kind !== 'add_event') continue;
    list.push({ ...fromForm(r.payload), color: r.payload.color ?? PALETTE[0], pending: !r.applied_at, error: r.error });
  }
  return list;
}

/** Meals or workouts with the phone's unapplied saves and deletes on top. */
function healthList(key, saveKind, deleteKind, source = snapshot?.health) {
  let list = (source?.[key] ?? []).map((x) => ({ ...x }));
  for (const r of pending()) {
    if (r.error) continue;
    const p = r.payload;
    if (r.kind === deleteKind) list = list.filter((x) => x.id !== p.id);
    else if (r.kind === saveKind) {
      const item = { ...p, pending: !r.applied_at };
      if (p.id) list = list.map((x) => (x.id === p.id ? item : x));
      else list.push({ ...item, id: 'p' + r.id });
    }
  }
  return list;
}

function todoDone(t) {
  let done = t.done;
  for (const r of pending()) if (r.kind === 'set_todo_done' && r.payload.id === t.id && !r.error) done = r.payload.done;
  return done;
}

/** Events (and todos with a deadline, like the PC calendar) per day, each day sorted. */
function dayMap() {
  const byDay = new Map();
  const put = (d, item) => { if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(item); };
  for (const e of allEvents()) for (const d of eventDays(e)) put(d, { type: 'event', e });
  for (const t of snapshot?.todos ?? []) if (t.due && !t.parent_id) put(t.due, { type: 'todo', t });
  for (const [d, items] of byDay) items.sort((a, b) => sortKey(a, d).localeCompare(sortKey(b, d)));
  return byDay;
}

function dayCard(d, items) {
  let html = '<div class="card">';
  for (const it of items) html += it.type === 'event' ? eventRow(it.e, d) : todoDueRow(it.t);
  return html + '</div>';
}

function renderCalendar() {
  const el = $('#p-calendar');
  const today = todayStr();
  const byDay = dayMap();
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  let d = addDays(ymd(first), -first.getDay());
  let html = `<div class="cal-head"><h2>${y}년 ${m}월</h2>
    <button class="mode-btn" data-go="events">목록</button>
    <button class="today-btn" data-cal="today">오늘</button>
    <button data-cal="-1" aria-label="이전 달">‹</button><button data-cal="1" aria-label="다음 달">›</button></div>`;
  html += '<div class="month"><div class="dows">' + DOW.map((x) => `<span>${x}</span>`).join('') + '</div>';
  const MAX_ROWS = 3;      // bars + pills shown per day
  const LANE = 16;         // px per bar row
  for (let w = 0; w < 6; w++) {
    if (w >= 4 && d.slice(0, 7) !== calMonth) break;
    const days = Array.from({ length: 7 }, (_, i) => addDays(d, i));
    // Events spanning several days become one bar across the week, like the PC calendar.
    const seen = new Set();
    const spans = [];
    for (const day of days) {
      for (const x of byDay.get(day) ?? []) {
        if (x.type !== 'event') continue;
        const all = eventDays(x.e);
        if (all.length < 2) continue;
        const key = `${x.e.id}|${x.e.occurrence ?? ''}|${x.e.start}|${x.e.title}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const s0 = days.indexOf(all[0]), s1 = days.indexOf(all[all.length - 1]);
        spans.push({ e: x.e, key, from: s0 < 0 ? 0 : s0, to: s1 < 0 ? 6 : s1, contL: s0 < 0, contR: s1 < 0 });
      }
    }
    spans.sort((a, b) => a.from - b.from || (b.to - b.from) - (a.to - a.from));
    const laneEnd = [];
    for (const sp of spans) {
      let lane = laneEnd.findIndex((end) => end < sp.from);
      if (lane < 0) { lane = laneEnd.length; laneEnd.push(-1); }
      laneEnd[lane] = sp.to;
      sp.lane = lane;
    }
    const shown = spans.filter((sp) => sp.lane < MAX_ROWS);
    html += '<div class="week">';
    days.forEach((day, i) => {
      const date = parseYmd(day);
      const items = byDay.get(day) ?? [];
      const evs = items.filter((x) => x.type === 'event');
      const covering = spans.filter((sp) => sp.from <= i && i <= sp.to);
      const lanesHere = covering.filter((sp) => sp.lane < MAX_ROWS).reduce((m, sp) => Math.max(m, sp.lane + 1), 0);
      const singles = evs.filter((x) => eventDays(x.e).length < 2);
      const room = Math.max(0, MAX_ROWS - lanesHere);
      const hidden = covering.filter((sp) => sp.lane >= MAX_ROWS).length + Math.max(0, singles.length - room);
      const cls = ['cell', day.slice(0, 7) !== calMonth ? 'other' : '', day === today ? 'today' : '', day === selectedDay ? 'sel' : '', i === 0 ? 'sun' : i === 6 ? 'sat' : '', HOLIDAYS[day] ? 'hd' : ''].join(' ');
      const pills = singles.slice(0, room).map((x) => `<span class="pill ${x.e.cancelled ? 'light' : ''}" style="background:${hex(x.e.color)}${repStyle(x.e)}">${esc(x.e.title)}</span>`).join('');
      const more = hidden > 0 ? `<span class="more-n">+${hidden}</span>` : '';
      html += `<button class="${cls}" data-day="${day}"><span class="n">${date.getDate()}</span>${lanesHere ? `<span class="lanes" style="height:${lanesHere * LANE - 2}px"></span>` : ''}${pills}${more}</button>`;
    });
    for (const sp of shown) {
      const cls = ['span', sp.contL ? 'cont-l' : '', sp.contR ? 'cont-r' : '', sp.e.cancelled ? 'light' : ''].join(' ');
      html += `<span class="${cls}" style="left:calc(${sp.from} * 100% / 7 + ${sp.contL ? 0 : 2}px);width:calc(${sp.to - sp.from + 1} * 100% / 7 - ${(sp.contL ? 0 : 2) + (sp.contR ? 0 : 2)}px);top:${29 + sp.lane * LANE}px;background:${hex(sp.e.color)}${repStyle(sp.e)}">${esc(sp.e.title)}</span>`;
    }
    html += '</div>';
    d = addDays(d, 7);
  }
  html += '</div>';
  const sel = parseYmd(selectedDay);
  const items = byDay.get(selectedDay) ?? [];
  html += `<div class="day sel-day"><h3><b>${sel.getMonth() + 1}월 ${sel.getDate()}일</b>${DOW[sel.getDay()]}요일${selectedDay === today ? ' · 오늘' : ''}${holi(selectedDay)}</h3>`;
  html += items.length ? dayCard(selectedDay, items) : '<div class="card"><div class="ev"><span class="meta">일정이 없어요. + 로 추가할 수 있어요.</span></div></div>';
  html += '</div>';
  if (snapshot && (calMonth < snapshot.from.slice(0, 7) || calMonth > snapshot.to.slice(0, 7))) {
    html += '<p class="empty" style="padding:16px">이 달은 휴대폰에 올라오지 않는 범위예요 (약 2달 전 ~ 6달 후).</p>';
  }
  el.innerHTML = html;
}

function renderEvents() {
  const el = $('#p-events');
  const today = todayStr();
  const byDay = dayMap();

  const first = showPast ? (snapshot?.from ?? addDays(today, -14)) : today;
  const last = snapshot?.to ?? addDays(today, 60);

  // Two-week strip
  let strip = '<div class="strip">';
  for (let i = 0; i < 21; i++) {
    const d = addDays(today, i);
    const date = parseYmd(d);
    const items = byDay.get(d) ?? [];
    const dots = items.filter((x) => x.type === 'event').slice(0, 3).map((x) => `<i style="background:${hex(x.e.color)}"></i>`).join('');
    const cls = [d === today ? 'today' : '', d === selectedDay ? 'sel' : ''].join(' ');
    const dc = date.getDay() === 0 || HOLIDAYS[d] ? 'sun' : date.getDay() === 6 ? 'sat' : '';
    strip += `<button class="${cls}" data-day="${d}"><span class="dow ${dc}">${DOW[date.getDay()]}</span><span class="num">${date.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  strip += '</div>';

  let html = `<div class="cal-head"><h2>다가오는 일정</h2><button class="mode-btn" data-go="calendar">달력</button></div>`;
  if (showPast) html += '<button class="more" data-act="hide-past">지난 일정 숨기기</button>';
  const days = [...byDay.keys()].filter((d) => d >= first && d <= last).sort();
  for (const d of days) {
    const items = byDay.get(d);
    const date = parseYmd(d);
    const rel = d === today ? '오늘' : d === addDays(today, 1) ? '내일' : '';
    html += `<div class="day ${d === today ? 'is-today' : ''}" id="d-${d}"><h3><b>${date.getMonth() + 1}월 ${date.getDate()}일</b>${DOW[date.getDay()]}요일${rel ? ' · ' + rel : ''}${holi(d)}</h3>${dayCard(d, items)}</div>`;
  }
  if (!days.length) html += `<div class="empty">${snapshot ? '다가오는 일정이 없어요' : ''}</div>`;
  el.innerHTML = html.replace('</div>', '</div>' + strip);
}

function sortKey(it, d) {
  if (it.type === 'todo') return '1' + (it.t.due_time || '99:99');
  const e = it.e;
  if (e.all_day || e.start.slice(0, 10) < d) return '0' + e.title;
  return '1' + e.start.slice(11, 16);
}

function eventRow(e, d) {
  const sd = e.start.slice(0, 10), ed = e.end.slice(0, 10);
  let time;
  if (e.all_day || (sd < d && ed > d)) time = '종일';
  else if (sd < d) time = `~${e.end.slice(11, 16)}`;
  else time = e.start.slice(11, 16);
  const meta = [e.location && `📍 ${esc(e.location)}`, !e.all_day && sd === d && ed === d ? `${e.start.slice(11, 16)}–${e.end.slice(11, 16)}` : '', esc(e.memo).slice(0, 160)].filter(Boolean).join('\n');
  const chip = e.error ? '<span class="chip err">실패</span>' : e.pending ? '<span class="chip">PC 반영 대기</span>' : '';
  const editable = typeof e.id === 'number';
  const idx = editable ? shownEvents.push(e) - 1 : -1;
  return `<div class="ev ${e.cancelled ? 'cancelled' : ''}" ${editable ? `data-ev="${idx}"` : ''}><span class="bar" style="background:${hex(e.color)}${e.repeats ? `;box-shadow:inset 0 0 0 1px ${deeper(e.color)}` : ''}"></span><span class="time">${time}</span><div class="body"><div class="title">${esc(e.title)}${chip}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div></div>`;
}

function todoDueRow(t) {
  const done = todoDone(t);
  return `<div class="ev todo-due ${done ? 'done' : ''}"><span class="bar" style="background:var(--surface-3)"></span><span class="time">${t.due_time || '마감'}</span><div class="body"><div class="title">${esc(t.title)}</div></div></div>`;
}

function renderTodos() {
  const el = $('#p-todos');
  const groups = snapshot?.todo_groups ?? [];
  const todos = (snapshot?.todos ?? []).map((t) => ({ ...t, done: todoDone(t) }));
  for (const r of pending()) {
    if (r.kind !== 'add_todo') continue;
    todos.push({ id: 'p' + r.id, group_id: r.payload.group_id ?? null, parent_id: null, title: r.payload.title, done: false, due: r.payload.due || null, due_time: r.payload.due_time || null, pending: !r.applied_at, error: r.error });
  }
  const sections = [...groups.map((g) => ({ ...g })), { id: null, name: '그룹 없음', color: 0x9aa0b4 }];
  const today = todayStr();
  let html = '';
  for (const g of sections) {
    const top = todos.filter((t) => !t.parent_id && (t.group_id ?? null) === g.id);
    if (!top.length && g.id === null) continue;
    const open = top.filter((t) => !t.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || String(a.id).localeCompare(String(b.id)));
    const done = top.filter((t) => t.done);
    const rows = (list) => list.map((t) => todoRow(t, g, today) + todos.filter((s) => s.parent_id === t.id).map((s) => todoRow(s, g, today, true)).join('')).join('');
    html += `<div class="group"><h3><i style="background:${hex(g.color)}"></i>${esc(g.name)} <small>${open.length}</small></h3><div class="card" style="--gc:${hex(g.color)}">`;
    html += rows(open) || '<div class="todo"><span class="muted" style="color:var(--muted);font-size:14px">할 일이 없어요</span></div>';
    if (done.length) html += `<details class="done-list"><summary>완료됨 ${done.length}개</summary>${rows(done)}</details>`;
    html += '</div></div>';
  }
  if (!html) html = `<div class="empty">${snapshot ? '할 일이 없어요' : ''}</div>`;
  el.innerHTML = html;
}

const fmt = (n) => new Intl.NumberFormat('ko-KR').format(Math.round(n));

function renderHealth() {
  const el = $('#p-health');
  const h = snapshot?.health;
  if (!h) { el.innerHTML = `<div class="empty">${snapshot ? 'PC 앱을 업데이트하면 식단·운동이 나타나요' : ''}</div>`; return; }
  const today = todayStr();
  const minDay = addDays(today, -14), maxDay = addDays(today, 14);
  const meals = healthList('meals', 'save_meal', 'delete_meal').filter((m) => m.date === healthDay);
  const workouts = healthList('workouts', 'save_workout', 'delete_workout').filter((w) => w.date === healthDay);
  const eaten = meals.filter((m) => m.eaten).reduce((a, m) => a + Number(m.kcal), 0);
  const planned = meals.filter((m) => !m.eaten).reduce((a, m) => a + Number(m.kcal), 0);
  const burned = workouts.reduce((a, w) => a + Number(w.kcal), 0);
  const left = h.goal - eaten + burned;
  const budget = Math.max(h.goal + burned, 1);
  const date = parseYmd(healthDay);
  const rel = healthDay === today ? ' · 오늘' : healthDay === addDays(today, -1) ? ' · 어제' : healthDay === addDays(today, 1) ? ' · 내일' : '';
  let html = `<div class="daynav"><button data-hday="-1" ${healthDay <= minDay ? 'disabled' : ''}>‹</button>
    <h2>${date.getMonth() + 1}월 ${date.getDate()}일 ${DOW[date.getDay()]}${rel}</h2>
    <button data-hday="1" ${healthDay >= maxDay ? 'disabled' : ''}>›</button></div>`;
  html += `<div class="kcal"><div class="label">${left >= 0 ? '오늘 더 먹을 수 있어요' : '목표보다 많이 먹었어요'}</div>
    <div class="big ${left < 0 ? 'over' : ''}">${fmt(Math.abs(left))}<small>kcal</small></div>
    <div class="bar2"><i style="width:${Math.min(100, (eaten / budget) * 100)}%;background:var(--primary)"></i><i style="width:${Math.max(0, Math.min(100 - (eaten / budget) * 100, (planned / budget) * 100))}%;background:var(--faint)"></i></div>
    <div class="nums"><div>먹음<b>${fmt(eaten)}</b></div><div>예정<b>${fmt(planned)}</b></div><div>운동<b>−${fmt(burned)}</b></div></div>
    ${planned ? `<div class="label" style="margin-top:10px">예정까지 다 먹으면 ${planned > left ? `<b style="color:var(--danger)">${fmt(planned - left)} kcal 넘쳐요</b>` : `${fmt(left - planned)} kcal 남아요`}</div>` : ''}
    <div class="label" style="margin-top:6px">목표 ${fmt(h.goal)} kcal · 체중 ${h.weight} kg (PC 설정)</div></div>`;
  for (const [id, label, icon] of SLOTS) {
    const list = meals.filter((m) => m.slot === id);
    const sum = list.reduce((a, m) => a + Number(m.kcal), 0);
    html += `<div class="hblock"><div class="section-h">${icon} ${label} ${list.length ? `<small>${fmt(sum)} kcal</small>` : ''}</div><div class="card">`;
    html += list.length ? list.map((m) => {
      const idx = shownHealth.push({ type: 'meal', ...m }) - 1;
      const chip = m.pending ? '<span class="chip">PC 반영 대기</span>' : m.eaten ? '' : '<span class="chip">예정</span>';
      return `<div class="row-item ${m.eaten ? 'eaten' : 'planned'}" data-h="${idx}">
        <button class="check" data-eat="${idx}" aria-label="먹었어요"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <div class="grow"><div class="name">${esc(m.name)}${chip}</div></div><span class="k">${fmt(m.kcal)} kcal</span></div>`;
    }).join('') : `<div class="row-item" data-addmeal="${id}"><span class="k">+ ${label} 추가</span></div>`;
    html += '</div></div>';
  }
  html += `<div class="hblock"><div class="section-h">🏃 운동 ${workouts.length ? `<small>${fmt(workouts.reduce((a, w) => a + Number(w.minutes), 0))}분 · ${fmt(burned)} kcal</small>` : ''}</div><div class="card">`;
  html += workouts.length ? workouts.map((w) => {
    const idx = shownHealth.push({ type: 'workout', ...w }) - 1;
    const [, label, , icon] = exOf(w.kind);
    return `<div class="row-item" data-h="${idx}"><span class="ico">${icon}</span>
      <div class="grow"><div class="name">${esc(label)}${w.pending ? '<span class="chip">PC 반영 대기</span>' : ''}</div>${w.note ? `<div class="k">${esc(w.note)}</div>` : ''}</div>
      <span class="k">${w.minutes}분 · ${fmt(w.kcal)} kcal</span></div>`;
  }).join('') : '<div class="row-item" data-addworkout="1"><span class="k">+ 운동 추가</span></div>';
  html += '</div></div>';
  el.innerHTML = html;
}

function money(n) {
  const cur = snapshot?.money?.currency || 'KRW';
  const dec = ['KRW', 'JPY'].includes(cur) ? 0 : 2;
  try { return new Intl.NumberFormat('ko-KR', { style: 'currency', currency: cur, minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n); }
  catch { return fmt(n); }
}

/** Whether a fixed payment counts as paid in `month`, including ticks still waiting for the PC. */
function fixedPaid(f, month, entries) {
  const id = snapshot?.money?.fixed_paid?.[month]?.[f.id];
  let paid = !!id && entries.some((x) => x.id === id);
  for (const r of pending()) {
    if (r.error || r.payload?.id !== f.id || r.payload?.month !== month) continue;
    if (r.kind === 'pay_fixed') paid = true;
    if (r.kind === 'unpay_fixed') paid = false;
  }
  return paid;
}

function renderMoney() {
  const el = $('#p-money');
  const m = snapshot?.money;
  if (!m) { el.innerHTML = `<div class="empty">${snapshot ? 'PC 앱을 업데이트하면 가계부가 나타나요' : ''}</div>`; return; }
  const today = todayStr();
  const all = healthList.call(null, 'expenses', 'save_expense', 'delete_expense', m);
  const list = all.filter((x) => x.date.slice(0, 7) === moneyMonth).sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
  // Categories left out of stats (paying for friends, being paid back) still show in the list below.
  const stat = list.filter((x) => counts(x.category));
  const spent = stat.filter((x) => x.kind !== 'income').reduce((a, x) => a + Number(x.amount), 0);
  const income = stat.filter((x) => x.kind === 'income').reduce((a, x) => a + Number(x.amount), 0);
  const [y, mo] = moneyMonth.split('-').map(Number);
  const minMonth = m.from_month || addDays(today.slice(0, 7) + '-01', -1).slice(0, 7);
  const maxMonth = addDays(today, 31).slice(0, 7);
  let html = `<div class="daynav"><button data-mm="-1" ${moneyMonth <= minMonth ? 'disabled' : ''}>‹</button><h2>${y}년 ${mo}월</h2><button data-mm="1" ${moneyMonth >= maxMonth ? 'disabled' : ''}>›</button></div>`;
  html += `<div class="kcal money-sum"><div class="label">지출</div><div class="big">${money(spent)}</div>`;
  const targets = m.category_budgets ?? {};
  const targetTotal = Object.values(targets).reduce((a, v) => a + Number(v || 0), 0);
  const budget = targetTotal || m.budget;
  // With category targets, only spending in those categories counts against the budget.
  const counted = targetTotal ? stat.filter((x) => x.kind !== 'income' && targets[x.category]).reduce((a, x) => a + Number(x.amount), 0) : spent;
  if (budget) {
    const left = budget - counted;
    html += `<div class="bar2"><i style="width:${Math.min(100, (counted / budget) * 100)}%;background:${left < 0 ? 'var(--danger)' : 'var(--primary)'}"></i></div>
      <div class="label">${left >= 0 ? `예산 ${money(budget)} 중 <b style="color:var(--text)">${money(left)}</b> 남았어요` : `예산보다 <b style="color:var(--danger)">${money(-left)}</b> 더 썼어요`}</div>`;
  }
  html += `<div class="nums" style="margin-top:12px;grid-template-columns:1fr 1fr"><div>수입<b class="amt in">+${money(income)}</b></div><div>수입 − 지출<b>${money(income - spent)}</b></div></div>`;
  const byCat = new Map();
  for (const x of stat) if (x.kind !== 'income') byCat.set(x.category, (byCat.get(x.category) ?? 0) + Number(x.amount));
  if (targetTotal) {
    // Budget vs spending per category with a target, most used first.
    const rows = Object.keys(targets).map((c) => [c, byCat.get(c) ?? 0, Number(targets[c])]).sort((a, b) => b[1] / b[2] - a[1] / a[2]);
    html += '<div class="cats">' + rows.map(([c, v, t]) => { const [, label, icon] = catOf(c); const over = v > t; return `<div class="c"><span>${icon}</span><span>${label}</span><span class="amt" ${over ? 'style="color:var(--danger)"' : ''}>${money(v)}<span style="color:var(--faint);font-weight:500"> / ${money(t)}</span></span><div class="track"><i style="width:${Math.min(100, (v / t) * 100)}%;${over ? 'background:var(--danger)' : ''}"></i></div></div>`; }).join('') + '</div>';
  } else {
    const top = [...byCat].sort((a, b) => b[1] - a[1]).slice(0, 5);
    if (top.length) {
      html += '<div class="cats">' + top.map(([c, v]) => { const [, label, icon] = catOf(c); return `<div class="c"><span>${icon}</span><span>${label}</span><span class="amt">${money(v)}</span><div class="track"><i style="width:${(v / top[0][1]) * 100}%"></i></div></div>`; }).join('') + '</div>';
    }
  }
  // Spending/income left out of stats (paying for friends, being paid back): faded, below the bars.
  const aside = new Map();
  for (const x of list) if (!counts(x.category)) aside.set(x.category, (aside.get(x.category) ?? 0) + Number(x.amount));
  if (aside.size) {
    const max = Math.max(...aside.values());
    html += '<div class="cats" style="opacity:.45;margin-top:6px">' + [...aside].sort((a, b) => b[1] - a[1]).map(([c, v]) => { const [, label, icon] = catOf(c); return `<div class="c"><span>${icon}</span><span>${label}</span><span class="amt">${money(v)}</span><div class="track"><i style="width:${(v / max) * 100}%"></i></div></div>`; }).join('') + '</div>';
  }
  html += '</div>';
  // Fixed monthly payments with a paid tick (set up on the PC).
  const fixed = [...(m.fixed ?? [])];
  if (fixed.length) {
    const last = new Date(y, mo, 0).getDate();
    const due = (f) => Math.min(Math.max(1, f.day), last);
    const rows = fixed.sort((a, b) => due(a) - due(b)).map((f) => ({ f, paid: fixedPaid(f, moneyMonth, all) }));
    const total = rows.reduce((a, r) => a + Number(r.f.amount), 0);
    const paidTotal = rows.filter((r) => r.paid).reduce((a, r) => a + Number(r.f.amount), 0);
    const nowDay = Number(today.slice(8));
    const isNow = moneyMonth === today.slice(0, 7);
    html += `<div class="hblock"><div class="section-h">🔁 고정 지출 <small>${money(paidTotal)} / ${money(total)}</small></div><div class="card">`;
    html += rows.map(({ f, paid }) => {
      const late = !paid && ((isNow && due(f) < nowDay) || moneyMonth < today.slice(0, 7));
      const soon = !paid && isNow && !late && due(f) - nowDay <= 3;
      const when = late ? `${due(f)}일 · 미납` : `${due(f)}일`;
      return `<div class="row-item fx ${paid ? 'eaten' : ''}"><button class="check" data-fx="${esc(f.id)}" data-paid="${paid ? 1 : 0}" aria-label="납부 체크"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><div class="grow"><div class="name">${esc(f.name)}</div><div class="k ${late ? 'late' : soon ? 'soon' : ''}">${when}</div></div><span class="amt">${money(f.amount)}</span></div>`;
    }).join('');
    html += '</div></div>';
  }
  let day = '';
  for (const x of list) {
    if (x.date !== day) {
      if (day) html += '</div></div>';
      day = x.date;
      const d = parseYmd(day);
      const sumDay = stat.filter((z) => z.date === day && z.kind !== 'income').reduce((a, z) => a + Number(z.amount), 0);
      html += `<div class="hblock"><div class="section-h">${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}${day === today ? ' · 오늘' : ''} ${sumDay ? `<small>−${money(sumDay)}</small>` : ''}</div><div class="card">`;
    }
    const idx = shownMoney.push(x) - 1;
    const [, label, icon, out] = catOf(x.category);
    const inc = x.kind === 'income';
    const sub = [x.note ? label : '', out ? '통계 제외' : ''].filter(Boolean).join(' · ');
    html += `<div class="row-item" data-m="${idx}"><span class="ico">${icon}</span><div class="grow"><div class="name">${esc(x.note || label)}${x.pending ? '<span class="chip">PC 반영 대기</span>' : ''}</div>${sub ? `<div class="k">${sub}</div>` : ''}</div><span class="amt ${inc ? 'in' : ''}" ${out ? 'style="color:var(--faint)"' : ''}>${inc ? '+' : '−'}${money(x.amount)}</span></div>`;
  }
  if (day) html += '</div></div>';
  if (!list.length) html += '<div class="empty">이 달 기록이 없어요. + 로 추가할 수 있어요.</div>';
  el.innerHTML = html;
}

/** One-line notes (the PC's Stickies), newest first, with the phone's unapplied adds and deletes. */
function allNotes() {
  let list = (snapshot?.stickies ?? []).map((n) => ({ ...n }));
  for (const r of pending()) {
    if (r.error) continue;
    if (r.kind === 'delete_sticky') list = list.filter((n) => n.id !== r.payload.id);
    else if (r.kind === 'add_sticky') list.unshift({ id: 'p' + r.id, text: r.payload.text, pending: !r.applied_at });
  }
  return list;
}

let armedNote = null;
function renderNotes() {
  const el = $('#p-notes');
  if (snapshot && !snapshot.stickies) { el.innerHTML = '<div class="empty">PC 앱을 업데이트하면 메모가 나타나요</div>'; return; }
  const keep = $('#memo-input')?.value ?? '';
  const list = allNotes();
  let html = `<div class="memo-add"><input id="memo-input" class="input" placeholder="한 줄 메모" maxlength="500" enterkeyhint="done" autocomplete="off" /><button class="btn" id="memo-add" type="button">추가</button></div>`;
  html += list.length
    ? '<div class="card">' + list.map((n) => `<div class="memo"><span class="t">${esc(n.text)}${n.pending ? '<span class="chip">PC 반영 대기</span>' : ''}</span>${typeof n.id === 'number' ? `<button class="x ${armedNote === n.id ? 'armed' : ''}" data-delnote="${n.id}" aria-label="삭제">${armedNote === n.id ? '삭제' : '×'}</button>` : ''}</div>`).join('') + '</div>'
    : '<div class="empty">메모가 없어요</div>';
  el.innerHTML = html;
  $('#memo-input').value = keep;
}

async function addNote() {
  const input = $('#memo-input');
  const text = input.value.trim();
  if (!text) return input.focus();
  input.value = '';
  if (!(await send('add_sticky', { text }))) input.value = text;
  $('#memo-input')?.focus();
}

$('#p-notes').addEventListener('click', async (e) => {
  if (e.target.closest('#memo-add')) return addNote();
  const del = e.target.closest('[data-delnote]');
  if (!del) { if (armedNote !== null) { armedNote = null; renderNotes(); } return; }
  const id = Number(del.dataset.delnote);
  if (armedNote !== id) { armedNote = id; return renderNotes(); }
  armedNote = null;
  const note = (snapshot?.stickies ?? []).find((n) => n.id === id);
  await send('delete_sticky', { id, title: note?.text });
});
$('#p-notes').addEventListener('keydown', (e) => {
  if (e.target.id === 'memo-input' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addNote(); }
});

function todoRow(t, g, today, sub = false) {
  let due = '';
  if (t.due) {
    const late = !t.done && (t.due < today || (t.due === today && t.due_time && t.due_time < new Date().toTimeString().slice(0, 5)));
    const date = parseYmd(t.due);
    due = `<div class="due ${late ? 'late' : ''}">${t.due === today ? '오늘' : `${date.getMonth() + 1}/${date.getDate()}`}${t.due_time ? ' ' + t.due_time : ''}${late ? ' · 지남' : ''}</div>`;
  }
  const chip = t.error ? '<span class="chip err">실패</span>' : t.pending ? '<span class="chip">PC 반영 대기</span>' : '';
  const checkable = typeof t.id === 'number';
  return `<div class="todo ${t.done ? 'done' : ''} ${sub ? 'sub' : ''}">
    <button class="check" ${checkable ? `data-todo="${t.id}" data-done="${t.done ? 1 : 0}"` : 'disabled'} aria-label="완료"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <div><div class="title">${esc(t.title)}${chip}</div>${due}</div></div>`;
}

function goTab(t) {
  tab = t;
  const navTab = t === 'events' ? 'calendar' : t;
  document.querySelectorAll('nav.tabs button').forEach((x) => x.classList.toggle('on', x.dataset.tab === navTab));
  for (const id of ['calendar', 'events', 'todos', 'health', 'money', 'notes']) $('#p-' + id).hidden = id !== t;
  window.scrollTo({ top: 0 });
  render();
}
document.querySelectorAll('nav.tabs button').forEach((b) => (b.onclick = () => goTab(b.dataset.tab)));
document.addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g) goTab(g.dataset.go); });

function onEventTap(e) {
  const row = e.target.closest('[data-ev]');
  if (row) { openSheet(shownEvents[Number(row.dataset.ev)]); return true; }
  return false;
}

$('#p-calendar').addEventListener('click', (e) => {
  if (onEventTap(e)) return;
  const nav = e.target.closest('[data-cal]');
  if (nav) {
    if (nav.dataset.cal === 'today') { calMonth = todayStr().slice(0, 7); selectedDay = todayStr(); }
    else {
      const [y, m] = calMonth.split('-').map(Number);
      const n = new Date(y, m - 1 + Number(nav.dataset.cal), 1);
      calMonth = ymd(n).slice(0, 7);
    }
    return renderCalendar();
  }
  const day = e.target.closest('[data-day]');
  if (day) {
    selectedDay = day.dataset.day;
    if (selectedDay.slice(0, 7) !== calMonth) calMonth = selectedDay.slice(0, 7);
    renderCalendar();
  }
});

$('#p-events').addEventListener('click', (e) => {
  if (onEventTap(e)) return;
  const day = e.target.closest('[data-day]');
  if (day) {
    selectedDay = day.dataset.day;
    renderEvents();
    const target = document.getElementById('d-' + selectedDay);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else toast('이 날은 일정이 없어요');
    return;
  }
  if (e.target.closest('[data-act="hide-past"]')) { showPast = false; renderEvents(); }
});

$('#p-todos').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-todo]');
  if (!b) return;
  b.disabled = true;
  if (navigator.vibrate) navigator.vibrate(8);
  await send('set_todo_done', { id: Number(b.dataset.todo), done: b.dataset.done !== '1' });
});

$('#p-health').addEventListener('click', async (e) => {
  const nav = e.target.closest('[data-hday]');
  if (nav) { healthDay = addDays(healthDay, Number(nav.dataset.hday)); return renderHealth(); }
  const eat = e.target.closest('[data-eat]');
  if (eat) {
    e.stopPropagation();
    const m = shownHealth[Number(eat.dataset.eat)];
    if (typeof m.id !== 'number') return toast('PC에 반영된 뒤에 바꿀 수 있어요');
    eat.disabled = true;
    if (navigator.vibrate) navigator.vibrate(8);
    const { type, pending: _p, ...meal } = m;
    return send('save_meal', { ...meal, eaten: !m.eaten });
  }
  const row = e.target.closest('[data-h]');
  if (row) {
    const item = shownHealth[Number(row.dataset.h)];
    if (typeof item.id !== 'number') return toast('PC에 반영된 뒤에 바꿀 수 있어요');
    return openHealthSheet(item.type, item);
  }
  const addMeal = e.target.closest('[data-addmeal]');
  if (addMeal) return openHealthSheet('meal', null, addMeal.dataset.addmeal);
  if (e.target.closest('[data-addworkout]')) return openHealthSheet('workout');
});

$('#p-money').addEventListener('click', (e) => {
  const nav = e.target.closest('[data-mm]');
  if (nav) {
    const [y, m] = moneyMonth.split('-').map(Number);
    moneyMonth = ymd(new Date(y, m - 1 + Number(nav.dataset.mm), 1)).slice(0, 7);
    return renderMoney();
  }
  const fx = e.target.closest('[data-fx]');
  if (fx) {
    fx.disabled = true;
    if (navigator.vibrate) navigator.vibrate(8);
    const f = (snapshot?.money?.fixed ?? []).find((x) => x.id === fx.dataset.fx);
    return send(fx.dataset.paid === '1' ? 'unpay_fixed' : 'pay_fixed', { id: fx.dataset.fx, month: moneyMonth, title: f?.name });
  }
  const row = e.target.closest('[data-m]');
  if (row) {
    const x = shownMoney[Number(row.dataset.m)];
    if (typeof x.id !== 'number') return toast('PC에 반영된 뒤에 바꿀 수 있어요');
    openMoneySheet(x.kind, x);
  }
});

$('#b-menu').onclick = (e) => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };
document.addEventListener('click', (e) => { if (!e.target.closest('#menu')) $('#menu').hidden = true; });

$('#colors').onclick = (e) => {

function syncColors() { document.querySelectorAll('#colors button').forEach((b) => b.classList.toggle('on', Number(b.dataset.color) === color)); }

const FORMS = { event: '#f-event', todo: '#f-todo', meal: '#f-meal', workout: '#f-workout', expense: '#f-money', income: '#f-money' };
function setKind(k) {
  kind = k;
  document.querySelectorAll('#kind-seg button').forEach((b) => b.classList.toggle('on', b.dataset.kind === k));
  for (const sel of new Set(Object.values(FORMS))) $(sel).hidden = sel !== FORMS[k];
  if (k === 'expense' || k === 'income') drawCats();
  const focus = { event: '#f-event [name=title]', todo: '#f-todo [name=title]', meal: '#f-meal [name=name]', workout: null }[k];
  if (focus && !editingHealth && !editing) setTimeout(() => $(focus).focus(), 260);
}
function showKinds(kinds) {
  document.querySelectorAll('#kind-seg button').forEach((b) => (b.hidden = !kinds.includes(b.dataset.kind)));
}
document.querySelectorAll('#kind-seg button').forEach((b) => (b.onclick = () => setKind(b.dataset.kind)));

function setScope(s) {
  scope = s;
  document.querySelectorAll('[data-scope]').forEach((b) => b.classList.toggle('on', b.dataset.scope === s));
}
document.querySelectorAll('[data-scope]').forEach((b) => (b.onclick = () => setScope(b.dataset.scope)));

function showSheet() {
  $('#scrim').hidden = false;
  $('#sheet').hidden = false;
  requestAnimationFrame(() => { $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); });
}

// ---- money sheet
function drawCats() {
  const cats = catsFor(kind === 'income' ? 'income' : 'expense');
  if (!cats.some((c) => c[0] === moneyCat)) moneyCat = cats[0][0];
  $('#catgrid').innerHTML = cats.map(([id, label, icon]) => `<button type="button" data-cat="${id}" class="${id === moneyCat ? 'on' : ''}"><span>${icon}</span>${label}</button>`).join('');
  $('#money-submit').textContent = editingMoney ? '저장' : kind === 'income' ? '수입 추가' : '지출 추가';
}
$('#catgrid').onclick = (e) => { const b = e.target.closest('[data-cat]'); if (b) { moneyCat = b.dataset.cat; drawCats(); } };
const amountInput = $('#f-money').amount;
amountInput.addEventListener('input', () => {
  const digits = amountInput.value.replace(/[^0-9.]/g, '');
  const [i, d] = digits.split('.');
  amountInput.value = (i ? Number(i).toLocaleString('ko-KR') : '') + (d !== undefined ? '.' + d.slice(0, 2) : '');
});

function openMoneySheet(k = 'expense', item = null) {
  editing = null; editingHealth = null;
  editingMoney = item;
  $('#sheet-title').hidden = !item;
  $('#sheet-title').textContent = k === 'income' ? '수입 수정' : '지출 수정';
  $('#kind-seg').hidden = false;
  showKinds(['expense', 'income']);
  const f = $('#f-money');
  f.reset();
  f.date.value = item?.date ?? (moneyMonth === todayStr().slice(0, 7) ? todayStr() : moneyMonth + '-01');
  if (item) { amountInput.value = Number(item.amount).toLocaleString('ko-KR'); f.note.value = item.note || ''; moneyCat = item.category; }
  else moneyCat = k === 'income' ? 'salary' : 'food';
  $('#money-delete').hidden = !item;
  setKind(k);
  showSheet();
  if (!item) setTimeout(() => amountInput.focus(), 260);
}

$('#f-money').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  const amount = Number(amountInput.value.replace(/,/g, ''));
  if (!(amount > 0)) return toast('금액을 입력해 주세요');
  const payload = { id: editingMoney?.id ?? 0, amount, category: moneyCat, date: f.date.value, note: f.note.value.trim(), kind: kind === 'income' ? 'income' : 'expense' };
  const ok = await send('save_expense', payload);
  if (ok) { moneyMonth = payload.date.slice(0, 7); closeSheet(); toast(editingMoney ? '수정 내용을 보냈어요' : '가계부에 보냈어요'); }
};
$('#money-delete').onclick = async () => {
  if (!editingMoney || !confirm('이 기록을 삭제할까요?')) return;
  if (await send('delete_expense', { id: editingMoney.id, title: editingMoney.note || catOf(editingMoney.category)[1] })) { closeSheet(); toast('삭제 요청을 보냈어요'); }
};

// ---- meals & workouts sheet
$('#w-kind').innerHTML = EXERCISES.map(([id, label, , icon]) => `<option value="${id}">${icon} ${label}</option>`).join('');
let kcalTouched = false;
function estimate() {
  const f = $('#f-workout');
  const w = Number(snapshot?.health?.weight) || 60;
  const min = Number(f.minutes.value) || 0;
  const est = Math.round((exOf(f.kind.value)[2] * w * min) / 60);
  if (!kcalTouched) f.kcal.value = min ? est : '';
  $('#w-hint').textContent = min ? `예상 소모 ${fmt(est)} kcal (체중 ${w}kg 기준)` : '';
}
$('#f-workout').kind.onchange = estimate;
$('#f-workout').minutes.oninput = estimate;
$('#f-workout').kcal.oninput = () => { kcalTouched = true; };

function setSlot(id) {
  mealSlot = id;
  document.querySelectorAll('[data-slot]').forEach((b) => b.classList.toggle('on', b.dataset.slot === id));
}
document.querySelectorAll('[data-slot]').forEach((b) => (b.onclick = () => setSlot(b.dataset.slot)));
const slotForNow = () => { const h = new Date().getHours(); return h < 11 ? 'breakfast' : h < 16 ? 'lunch' : h < 21 ? 'dinner' : 'snack'; };

function openHealthSheet(k, item = null, slot = null) {
  editing = null; editingMoney = null;
  editingHealth = item;
  $('#sheet-title').hidden = !item;
  $('#sheet-title').textContent = k === 'meal' ? '식사 수정' : '운동 수정';
  $('#kind-seg').hidden = !!item;
  showKinds(['meal', 'workout']);
  const m = $('#f-meal');
  m.reset();
  m.date.value = item?.date ?? healthDay;
  setSlot(item?.slot ?? slot ?? (healthDay === todayStr() ? slotForNow() : 'lunch'));
  if (k === 'meal' && item) { m.name.value = item.name; m.kcal.value = item.kcal; m.eaten.checked = !!item.eaten; }
  else m.eaten.checked = healthDay <= todayStr();
  $('#meal-submit').textContent = item && k === 'meal' ? '저장' : '식사 추가';
  $('#meal-delete').hidden = !(item && k === 'meal');
  const w = $('#f-workout');
  w.reset();
  w.date.value = item?.date ?? healthDay;
  kcalTouched = !!(item && k === 'workout');
  if (k === 'workout' && item) { w.kind.value = item.kind; w.minutes.value = item.minutes; w.kcal.value = item.kcal; w.note.value = item.note || ''; }
  else { w.minutes.value = 30; }
  estimate();
  $('#workout-submit').textContent = item && k === 'workout' ? '저장' : '운동 추가';
  $('#workout-delete').hidden = !(item && k === 'workout');
  setKind(k);
  showSheet();
}

$('#f-meal').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  if (!name) return;
  const kcal = Math.max(0, Math.min(20000, Math.round(Number(f.kcal.value) || 0)));
  const payload = { id: editingHealth?.id ?? 0, date: f.date.value, slot: mealSlot, name, kcal, eaten: f.eaten.checked };
  const ok = await send('save_meal', payload);
  if (ok) { healthDay = payload.date; closeSheet(); toast(editingHealth ? '수정 내용을 보냈어요' : '식사를 보냈어요'); }
};
$('#f-workout').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  const minutes = Math.round(Number(f.minutes.value) || 0);
  if (minutes < 1 || minutes > 1440) return toast('운동 시간을 확인해 주세요');
  const payload = { id: editingHealth?.id ?? 0, date: f.date.value, kind: f.kind.value, minutes, kcal: Math.max(0, Math.min(20000, Math.round(Number(f.kcal.value) || 0))), note: f.note.value.trim() };
  const ok = await send('save_workout', payload);
  if (ok) { healthDay = payload.date; closeSheet(); toast(editingHealth ? '수정 내용을 보냈어요' : '운동을 보냈어요'); }
};
$('#meal-delete').onclick = async () => {
  if (!editingHealth || !confirm('이 식사를 삭제할까요?')) return;
  if (await send('delete_meal', { id: editingHealth.id, title: editingHealth.name })) { closeSheet(); toast('삭제 요청을 보냈어요'); }
};
$('#workout-delete').onclick = async () => {
  if (!editingHealth || !confirm('이 운동 기록을 삭제할까요?')) return;
  if (await send('delete_workout', { id: editingHealth.id, title: exOf(editingHealth.kind)[1] })) { closeSheet(); toast('삭제 요청을 보냈어요'); }
};

function openSheet(ev = null) {
  if (tab === 'health' && !ev) return openHealthSheet('meal');
  if (tab === 'money' && !ev) return openMoneySheet('expense');
  if (tab === 'notes' && !ev) { $('#memo-input')?.focus(); return; }
  editingHealth = null; editingMoney = null;
  showKinds(['event', 'todo']);
  const f = $('#f-event');
  f.reset();
  editing = ev ? { id: ev.id, occurrence: ev.occurrence ?? null, repeats: !!ev.repeats } : null;
  $('#kind-seg').hidden = !!ev;
  $('#sheet-title').hidden = !ev;
  $('#ev-delete').hidden = !ev;
  $('#scope').hidden = !ev?.repeats;
  $('#ev-submit').textContent = ev ? '저장' : '일정 추가';
  setScope('one');
  if (ev) {
    f.title.value = ev.title;
    f.all_day.checked = !!ev.all_day;
    f.start_date.value = ev.start.slice(0, 10);
    f.end_date.value = ev.end.slice(0, 10);
    f.start_time.value = ev.all_day ? '09:00' : ev.start.slice(11, 16);
    f.end_time.value = ev.all_day ? '10:00' : ev.end.slice(11, 16);
    f.location.value = ev.location || '';
    f.memo.value = ev.memo || '';
    f.reminder.value = ev.reminder == null ? '' : String(ev.reminder);
    if (f.reminder.value !== String(ev.reminder ?? '')) {
      f.reminder.insertAdjacentHTML('beforeend', `<option value="${ev.reminder}">${ev.reminder}분 전</option>`);
      f.reminder.value = String(ev.reminder);
    }
    color = ev.color;
  } else {
    const day = selectedDay < todayStr() ? todayStr() : selectedDay;
    f.start_date.value = day;
    f.end_date.value = day;
    const now = new Date();
    const h = Math.min(now.getHours() + 1, 23);
    f.start_time.value = `${pad(h)}:00`;
    f.end_time.value = `${pad(Math.min(h + 1, 23))}:${h + 1 > 23 ? '55' : '00'}`;
    color = PALETTE[0];
  }
  syncColors();
  timedFields();
  const t = $('#f-todo');
  t.reset();
  $('#t-group').innerHTML = '<option value="">그룹 없음</option>' + (snapshot?.todo_groups ?? []).map((g) => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
  $('#sheet-title').textContent = '일정 수정';
  setKind(ev || tab !== 'todos' ? 'event' : 'todo');
  showSheet();
}
function closeSheet() {
  $('#scrim').classList.remove('open');
  $('#sheet').classList.remove('open');
  setTimeout(() => { $('#scrim').hidden = true; $('#sheet').hidden = true; }, 250);
}
$('#b-add').onclick = () => openSheet();
$('#scrim').onclick = closeSheet;

function timedFields() { $('[data-timed]').hidden = $('#f-event').all_day.checked; }
$('#f-event').all_day.onchange = timedFields;
$('#f-event').start_date.onchange = (e) => {
  const f = $('#f-event');
  if (!f.end_date.value || f.end_date.value < e.target.value) f.end_date.value = e.target.value;
};

$('#f-event').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  const title = f.title.value.trim();
  if (!title) return;
  const all_day = f.all_day.checked;
  const start_date = f.start_date.value;
  const end_date = f.end_date.value && f.end_date.value >= start_date ? f.end_date.value : start_date;
  if (!all_day && end_date === start_date && f.end_time.value && f.end_time.value <= f.start_time.value) return toast('종료 시간이 시작보다 늦어야 해요');
  const payload = {
    title, all_day, start_date, end_date,
    start_time: all_day ? null : f.start_time.value || null,
    end_time: all_day ? null : f.end_time.value || null,
    location: f.location.value.trim(), memo: f.memo.value, color,
    reminder: f.reminder.value ? Number(f.reminder.value) : null,
  };
  f.querySelector('[type=submit]').disabled = true;
  const ok = editing
    ? await send('update_event', { ...payload, id: editing.id, occurrence: editing.occurrence, scope: editing.repeats ? scope : 'all' })
    : await send('add_event', payload);
  f.querySelector('[type=submit]').disabled = false;
  if (ok) { closeSheet(); toast(editing ? '수정 내용을 보냈어요' : '일정을 보냈어요'); }
};

$('#ev-delete').onclick = async () => {
  if (!editing) return;
  const what = editing.repeats ? (scope === 'all' ? '반복 일정 전체를' : '이 날짜의 일정만') : '이 일정을';
  if (!confirm(`${what} 삭제할까요?`)) return;
  $('#ev-delete').disabled = true;
  const ok = await send('delete_event', { id: editing.id, occurrence: editing.occurrence, scope: editing.repeats ? scope : 'all', title: $('#f-event').title.value });
  $('#ev-delete').disabled = false;
  if (ok) { closeSheet(); toast('삭제 요청을 보냈어요'); }
};

$('#f-todo').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  const title = f.title.value.trim();
  if (!title) return;
  const payload = { title, group_id: f.group_id.value ? Number(f.group_id.value) : null, due: f.due.value || null, due_time: f.due.value && f.due_time.value ? f.due_time.value : null };
  f.querySelector('[type=submit]').disabled = true;
  const ok = await send('add_todo', payload);
  f.querySelector('[type=submit]').disabled = false;
  if (ok) { closeSheet(); toast('할 일을 보냈어요'); }
};

boot();
</script>
</body>
</html>
